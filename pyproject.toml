[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "streamobs"
version = "0.1.0"
description = "Stellar stream simulation and observation toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "LSST DESC" }]
keywords = ["astronomy", "stellar-streams", "simulation", "LSST"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "astropy",
    "healpy",
    "healsparse",
    "gala",
    "pyarrow", # parquet I/O (streamobs.background.storage)
]

# `ugali` (CMD/isochrone sampling) must be installed from GitHub, NOT from PyPI:
#   pip install git+https://github.com/DarkEnergySurvey/ugali.git
# The PyPI release (1.8.0) predates CMD 3.8 isochrone column support and parses
# those files against the wrong columns, yielding "Probabilities contain NaN"
# at sampling time. See docs/source/installation.md.
[project.optional-dependencies]
isochrones = ["ugali"]
plotting = ["skyproj"] # sky-map helpers (guarded import in streamobs.plotting)
dev = ["pytest", "pytest-cov"] # pytest.ini addopts include --cov flags
# Keep in sync with docs/requirements.txt. `myst-nb` supersedes `myst-parser`
# (and brings it in as a dependency); `conf.py` loads the `myst_nb` extension,
# so a `myst-parser`-only install fails the build with an ExtensionError.
docs = ["sphinx>=8.0", "sphinx-book-theme", "numpydoc", "myst-nb"]


[project.urls]
Homepage = "https://github.com/LSSTDESC/streamobs"
Documentation = "https://lsstdesc.github.io/streamobs/"
Issues = "https://github.com/LSSTDESC/streamobs/issues"

[tool.setuptools.packages.find]
include = ["streamobs*"]
exclude = ["tests*", "notebooks*", "docs*", "bin*"]
