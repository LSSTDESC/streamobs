# Configuration file for the survey Euclid, release DR1
#
# Euclid Data Release 1: the first ~2100 deg^2 of the Wide Survey. No DR1
# catalogue is used here; the release is the DR1 *input coverage map*
# (cgv_map_dr1input_o13.fits.gz, nside 8192 binary mask, 2108.5 deg^2) filled
# with a UNIFORM depth per band -- the nominal Wide-survey 5-sigma point-source
# depth that Q1 was anchored to -- and it carries the euclid/q1 selection-
# function tables by symlink, the way lsst_dp2 carries the lsst_dc2 tables and
# the Roman HLWAS tiers carry roman_dc2's. Depth variations across DR1
# (exposure count, zodiacal background, stray light) are therefore NOT in the
# maps; swap in a measured DR1 depth map when one exists.
#
# Generated by scripts/euclid/build_euclid_dr1_maglim_maps.py from the Q1 audit.
name: euclid
release: dr1
survey_files:
    # Path to data files (leave empty for default location)
    file_path: ''

    # Band-specific magnitude limit maps, nside 128 (ring): uniform 26.2 (VIS)
    # and 24.5 (Y, J, H) over the DR1 footprint. The nside-8192 mask is
    # degraded to the covered fraction per nside-128 pixel and a pixel is kept
    # when that fraction is >= 0.5, which preserves the area (2108 -> 2118
    # deg^2) rather than inflating the footprint by 10-20% as an any-subpixel
    # rule would at this resolution.
    maglim_map_VIS: euclid_dr1_maglim_vis_nside128.fits.gz
    maglim_map_Y: euclid_dr1_maglim_y_nside128.fits.gz
    maglim_map_J: euclid_dr1_maglim_j_nside128.fits.gz
    maglim_map_H: euclid_dr1_maglim_h_nside128.fits.gz

    # Band-independent maps
    ebv_map: ebv_sfd98_lowres_nside_512_ring_equatorial.fits

    # Q1-derived selection-function tables (symlinked from data/surveys/euclid_q1/
    # by scripts/euclid/build_euclid_dr1_maglim_maps.py). They are delta_mag-keyed,
    # so the uniform DR1 depth is already accounted for; what is assumed is that
    # the Wide-depth deep-field pass of Q1 describes the Wide survey proper,
    # which is the same instrument, exposure sequence and pipeline.
    completeness: euclid_q1_stellar_efficiency_cutvis.csv
    completeness_band: VIS
    gal_misclassification: euclid_q1_galaxy_misclass_cutvis.csv

    # Two-curve photometric error model, see config/surveys/euclid_q1.yaml.
    log_photo_error_catalog: euclid_q1_photoerror_vis_catalog.csv
    log_photo_error_sample: euclid_q1_photoerror_vis.csv
    # Forced-photometry (non-reference band) curves, required for Y/J/H.
    log_photo_error_catalog_nocut: euclid_q1_photoerror_vis_catalog_nocut.csv
    log_photo_error_sample_nocut: euclid_q1_photoerror_vis_nocut.csv

survey_properties:
  bands: ['VIS', 'Y', 'J', 'H']

  # Extinction coefficients per band (A_band / E(B-V)_SFD), as euclid_q1:
  # Fitzpatrick 1999 R_V = 3.1 at the SVO pivot wavelengths x 0.86 (SF11).
  coeff_extinc_VIS: 1.790
  coeff_extinc_Y: 0.879
  coeff_extinc_J: 0.595
  coeff_extinc_H: 0.400

  # Systematic photometric error (mag), package default (not measured).
  sys_error: 0.005

  # Saturation, as euclid_q1 (VIS measured, NISP a floor).
  saturation_VIS: 17.5
  saturation_Y: 15.5
  saturation_J: 15.5
  saturation_H: 15.5
