# Configuration file for the survey LSST
name: lsst
release: dc2
survey_files: 
    # Path to data files (leave empty for default location)
    file_path: ''

    # Band-specific magnitude limit maps: S/N=5 point-source depth on the NATIVE
    # reported-error scale, nside 1024. supreme_dc2 supplies the spatial structure
    # and footprint, degraded to nside=1024.
    #
    # NOT truth-anchored. Truth-anchoring was removed here in 2026-09: the DC2
    # reported errors run only ~1.4x optimistic against the truth scatter, small
    # enough that the native-scale map reproduces an external calibration (Tsiane
    # et al. 2025) to 0.1%, so anchoring bought nothing. Roman DC2 keeps its
    # anchor because its discrepancy is ~2x. See
    # docs/source/selection_function_methodology.md.
    # Shipped medians: g 26.972, r 26.846. The delta_mag axes of the completeness
    # and photo-error tables are keyed to this convention.
    # Derivation: scripts/lsst/create_streamobs_files_lsst_dc2.py.
    maglim_map_r: lsst_dc2_maglim_r_nside1024.fits.gz
    maglim_map_g: lsst_dc2_maglim_g_nside1024.fits.gz
    # r-derived completeness + photo-error, applied to all bands band-independently
    # (via delta_mag = maglim_band - true_mag), per the streamobs convention.

    # Band-independent maps
    ebv_map: ebv_sfd98_lowres_nside_512_ring_equatorial.fits
    completeness: lsst_dc2_stellar_efficiency_cutr.csv
    completeness_band: r # the completeness has been obtained in the r band
    # Galaxy misclassification: fraction of compact (cosmoDC2 size_true < 0.3")
    # true galaxies detected (S/N>5, clean) yet classified as point sources
    # (extendedness < 0.5), vs delta_mag = mag_r - maglim_r
    # (built by scripts/lsst/build_lsst_dc2_galaxy_misclass.py).
    gal_misclassification: lsst_dc2_galaxy_misclass_cutr.csv

    # Two-curve photometric error model (streamobs Survey.get_photo_error):
    #   catalog = median reported magerr    -> written as `magerr`, drives the S/N cut;
    #   sample  = truth-based scatter of (obs - true) -> drives the noise draw
    #             (the true scatter is ~1.4x the reported magerr in the DC2 coadds).
    log_photo_error_catalog: lsst_dc2_photoerror_r_catalog.csv
    log_photo_error_sample: lsst_dc2_photoerror_r.csv
    # Forced-photometry (non-reference band) curves: measured with NO S/N cut, because
    # g photometry is forced from the r detection and so is not conditioned on g-band
    # detection. Required for any band that is not `completeness_band`.
    log_photo_error_catalog_nocut: lsst_dc2_photoerror_r_catalog_nocut.csv
    log_photo_error_sample_nocut: lsst_dc2_photoerror_r_nocut.csv

survey_properties: 
  bands: ['u', 'g', 'r', 'i', 'z', 'y']

  # Extinction coefficients per band (A_band / E(B-V)) 
  # From rubin_sim (verions = 2.6.0, baseline version = 5.0.0)
  # from rubin_sim.phot_utils import DustValues
  # dust_values = DustValues()
  # print(dust_values.r_x)
  coeff_extinc_u: 4.757217815396922
  coeff_extinc_g: 3.6605664439892625
  coeff_extinc_r: 2.70136780871597
  coeff_extinc_i: 2.0536599130965882
  coeff_extinc_z: 1.5900964472616756
  coeff_extinc_y: 1.3077049588254708

  # Systematic photometric errors (mag), or could be specified as sys_error_g, sys_error_r, etc
  sys_error : 0.005 # Error common to all bands
  # sys_error_i: 0.01  # Example to Override for i-band


  # Saturation limits per band, or could be specified as saturation_g, saturation_r, etc
  saturation: 16.0
  delta_saturation: -10.4
